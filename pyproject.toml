[project]
name = "video-studio"
version = "0.1.0"
description = "AI 短剧工坊 —— 人人都能搞创作，不受硬件、算力限制"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lvnet" }]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["video_studio*"]
