<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 短剧工坊 · 工作台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">米</div>
        <div>
          <div class="brand-title">AI 短剧工坊</div>
          <div class="brand-sub">video-studio 工作台</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="overview"><span class="ni">◎</span>总览</button>
        <div class="nav-label">八步制作链</div>
        <button class="nav-item" data-view="script"><span class="ni">1</span>剧本与拆镜</button>
        <button class="nav-item" data-view="prompt"><span class="ni">2</span>提示词工程</button>
        <button class="nav-item" data-view="asset"><span class="ni">3</span>参考资产</button>
        <button class="nav-item" data-view="task"><span class="ni">4</span>生成任务</button>
        <button class="nav-item" data-view="post"><span class="ni">5</span>后期成片</button>
        <div class="nav-label">控制与合规</div>
        <button class="nav-item" data-view="cost"><span class="ni">¥</span>成本闸门</button>
        <button class="nav-item" data-view="compliance"><span class="ni">✓</span>合规审计</button>
      </nav>
      <div class="sidebar-foot">
        <div class="status-dot"></div>
        <span id="connStatus">连接中…</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">总览</h1>
          <p id="viewDesc" class="view-desc">项目全流程一览</p>
        </div>
        <div class="topbar-actions">
          <select id="projectSelect" class="select" title="切换项目"></select>
          <button id="btnDemo" class="btn btn-ghost">载入示例</button>
          <button id="btnRefresh" class="btn">刷新</button>
        </div>
      </header>

      <div class="content" id="content">
        <!-- 各视图由 app.js 动态渲染 -->
        <div class="loading">正在加载工作台…</div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><span id="modalTitle">详情</span><button id="modalClose" class="modal-x">×</button></div>
      <pre id="modalBody" class="modal-body"></pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
